<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Optimization | CargoPilot AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <h2>🚢 CargoPilot AI</h2>

        <ul>
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="challenges.html">⚠ Challenges</a></li>
            <li><a href="route-optimization.html">📍 Route Optimization</a></li>
            <li><a href="quotation.html">💰 Quotation</a></li>
            <li><a href="analytics.html">📈 Analytics</a></li>
            <li><a href="login.html">🚪 Logout</a></li>
        </ul>

    </div>

    <!-- Main Content -->
    <div class="main-content">

        <div class="page-header">
            <h1>📍 Route Optimization</h1>
            <p>
                Analyze shipping routes and get the
                best AI-powered recommendation.
            </p>
        </div>

        <div class="route-form-card">

            <h2>Shipment Details</h2>

            <div class="form-group">
                <label>Origin Port</label>
                <input
                    type="text"
                    id="origin"
                    placeholder="Enter Origin Port"
                >
            </div>

            <div class="form-group">
                <label>Destination Port</label>
                <input
                    type="text"
                    id="destination"
                    placeholder="Enter Destination Port"
                >
            </div>

            <div class="form-group">
                <label>Cargo Type</label>
                <input
                    type="text"
                    id="cargo_type"
                    placeholder="Enter Cargo Type"
                >
            </div>

            <div class="form-group">
                <label>Containers</label>
                <input
                    type="number"
                    id="containers"
                    placeholder="Number of Containers"
                >
            </div>

            <button
                class="analyze-btn"
                onclick="analyzeRoute()">
                Analyze Route
            </button>

        </div>

        <div
            id="routeResult"
            class="result-card"
            style="display:none;">
        </div>

    </div>

<script>

async function analyzeRoute(){

    const origin =
        document.getElementById("origin").value;

    const destination =
        document.getElementById("destination").value;

    const cargo_type =
        document.getElementById("cargo_type").value;

    const containers =
        parseInt(
            document.getElementById("containers").value
        );

    try{

        const response =
            await fetch(
                "http://127.0.0.1:8000/api/routes/analyze",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        origin,
                        destination,
                        cargo_type,
                        containers
                    })
                }
            );

        const data =
            await response.json();

        document.getElementById(
            "routeResult"
        ).style.display = "block";

        document.getElementById(
            "routeResult"
        ).innerHTML = `

            <h2>📊 AI Recommended Route</h2>

            <div class="success-badge">
                ✓ AI Recommended
            </div>

            <p>
                <strong>Route ID:</strong>
                ${data.route_id}
            </p>

            <p>
                <strong>Origin:</strong>
                ${data.origin}
            </p>

            <p>
                <strong>Destination:</strong>
                ${data.destination}
            </p>

            <p>
                <strong>Distance:</strong>
                ${data.distance_nm} NM
            </p>

            <p>
                <strong>Transit Days:</strong>
                ${data.transit_days}
            </p>

            <p>
                <strong>Transshipments:</strong>
                ${data.transshipments}
            </p>

            <p>
                <strong>Route Type:</strong>
                ${data.route_type}
            </p>

            <p>
                <strong>Base Freight:</strong>
                $${data.base_freight_usd}
            </p>

        `;

        localStorage.setItem(
            "routeData",
            JSON.stringify(data)
        );

    }
    catch(error){

        alert(
            "Unable to connect to backend."
        );

        console.error(error);
    }
}

</script>

</body>
</html>

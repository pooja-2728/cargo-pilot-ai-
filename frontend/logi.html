<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CargoPilot AI Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#081229;
        }

        .login-container{

            width:420px;
            background:#1e293b;
            padding:40px;
            border-radius:20px;
            text-align:center;
            color:white;

        }

        .logo{
            font-size:50px;
            margin-bottom:10px;
        }

        h1{
            margin-bottom:10px;
        }

        .subtitle{
            color:#cbd5e1;
            margin-bottom:30px;
        }

        input{

            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:none;
            border-radius:10px;
            font-size:15px;

        }

        button{

            width:100%;
            padding:14px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;

        }

        button:hover{
            background:#1d4ed8;
        }

        .register-link{
            margin-top:20px;
            color:#cbd5e1;
        }

        .register-link a{
            color:#60a5fa;
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">🚢</div>

    <h1>CargoPilot AI</h1>

    <p class="subtitle">
        Agentic Maritime Freight Pricing &
        Route Optimization
    </p>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        Login
    </button>

</div>

<script>

async function login(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if(username === "" || password === ""){

        alert("Please enter username and password");

        return;
    }

    try{

        const response =
            await fetch(
                "http://127.0.0.1:8000/login",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if(data.message === "Login successful"){

            localStorage.setItem(
                "username",
                username
            );

            window.location.href =
                "dashboard.html";
        }
        else{

            alert("Wrong password");
        }

    }
    catch(error){

        alert(
            "Backend not running. Please start FastAPI server."
        );

        console.error(error);
    }
}

</script>

</body>
</html>
